name: Build & Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
      short_sha: ${{ steps.apk.outputs.short_sha }}
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      # Optional production signing. Configure these repository secrets to enable it:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them (e.g. on fork PRs) the build falls back to debug-key signing, which
      # still produces an installable APK.
      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets."
          else
            echo "::notice::No release keystore secret configured - APK will be signed with a debug key."
          fi

      - name: Unit tests
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Assemble release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature and name APK
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          name="AsiaShieldVPN-${short_sha}.apk"
          src="app/build/outputs/apk/release/app-release.apk"
          test -f "$src" || { echo "::error::Signed APK not found at $src"; ls -R app/build/outputs/apk; exit 1; }
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --print-certs "$src"
          mkdir -p dist
          cp "$src" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsiaShieldVPN-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: AsiaShieldVPN-apk
          path: dist

      - name: Create release tagged with the commit SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          APK_NAME: ${{ needs.build.outputs.apk_name }}
        run: |
          tag="build-${SHORT_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Workflow re-run for the same commit: refresh the assets.
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --target "$GITHUB_SHA" \
              --title "AsiaShield VPN 1.0.${{ github.run_number }} (${SHORT_SHA})" \
              --notes "Automated build of commit ${GITHUB_SHA}. Download \`${APK_NAME}\` and open it on an Android 8.0+ device to install." \
              --latest
          fi
